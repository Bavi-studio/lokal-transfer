[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-transfer"
version = "0.1.0"
description = "Local file and text transfer API"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "psutil>=5.9,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
